name: Ghost Bot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # ম্যানুয়ালি গিটহাব থেকে রান করার অপশন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ১. গিটহাব রিপোজিটরি কোড চেকআউট করা
    - name: Checkout Repository
      uses: actions/checkout@v3

    # ২. নোড জেএস সেটআপ করা (ভার্সন ২০)
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'

    # 🌟 ৩. অ্যানিমেশন ও জিআইএফ কমান্ড সচল করার মূল লাইব্রেরি ইনস্টল করা
    - name: Install System Graphics Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev build-essential

    # 🌟 ৪. ক্যাশ ফোল্ডার অটোমেটিক তৈরি করা (যাতে ফাইল পাথ এরর না আসে)
    - name: Create Cache Directory
      run: |
        mkdir -p cache
        mkdir -p ghost-bot/cache

    # ৫. বটের ডিপেন্ডেন্সি বা প্যাকেজ ইনস্টল করা
    - name: Install dependencies
      run: npm install

    # ╚═★ ৬. সিক্রেটস ভেরিয়েবল সহ বট স্টার্ট করা
    - name: Start the bot
      env:
        PORT: 8080
        FBSTATE: ${{ secrets.FBSTATE }}
        MONGO_URI: ${{ secrets.MONGO_URI }}
        NODE_ENV: production
      run: npm start
      
