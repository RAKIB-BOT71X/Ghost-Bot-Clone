name: Ghost Bot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 🌟 ১. নোড ভার্সন ১৮ ব্যবহার করা (যা ক্যানভাসের জন্য সবচেয়ে স্টেবল)
    - name: Use Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'

    # 🌟 ২. সিস্টেম লাইব্রেরিগুলো সম্পূর্ণ আপডেট করে ইনস্টল করা
    - name: Install System Graphics Dependencies
      run: |
        sudo apt-get update-all || sudo apt-get update
        sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

    # ৩. ক্যাশ ফোল্ডার তৈরি
    - name: Create Cache Directory
      run: |
        mkdir -p cache
        mkdir -p ghost-bot/cache

    # 🌟 ৪. ক্যানভাস বিল্ড এরর বাইপাস করার জন্য বিশেষ ফ্ল্যাগসহ ইনস্টলেশন
    - name: Install dependencies
      run: |
        npm install --build-from-source=false || npm install --legacy-peer-deps

    # ৫. বট স্টার্ট
    - name: Start the bot
      env:
        PORT: 8080
        FBSTATE: ${{ secrets.FBSTATE }}
        MONGO_URI: ${{ secrets.MONGO_URI }}
        NODE_ENV: production
      run: npm start
